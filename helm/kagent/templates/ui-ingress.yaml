{{- if .Values.ui.ingress.enabled }}
{{- if not .Values.ui.ingress.hosts }}
{{- fail "ui.ingress.hosts must contain at least one host when ui.ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kagent.fullname" . }}-ui
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.ui.labels" . | nindent 4 }}
    {{- with .Values.ui.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ui.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ui.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ui.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range (required "each ui.ingress.hosts entry needs a non-empty paths list" .paths) }}
          {{- $backend := .backend | default dict }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $backend.name | default (printf "%s-ui" (include "kagent.fullname" $)) }}
                port:
                  number: {{ $backend.port | default $.Values.ui.service.ports.port }}
          {{- end }}
    {{- end }}
{{- end }}
